
dataset:
  data_name: "acic2018"

train:
  epochs: 500
  batch_size: 256
  lr: 0.0005
  weight_decay: 0.002
  valid_epoch_interval: 50

diffusion:
  # Conditioning: "global_broadcast" = (T, noisy y) -> channel bias (default, COVID-style).
  # "fused_add" = Downloads-style: concat [T, flatten(X)] + Linear(noisy_y), same width, seq_len=1 backbone.
  conditioning: "global_broadcast"
  # fused_cond_dim: 178  # required if conditioning is "fused_add" (ACIC: 1 + 177 covariates)
  layers: 6
  channels: 64
  input_vars: 177
  cond_dim: 177
  seq_len: 1
  target_dim: 2
  hidden_dim: 256
  side_dim: 33
  nheads: 2
  diffusion_embedding_dim: 128
  beta_start: 0.0001
  beta_end: 0.5
  num_steps: 100
  schedule: "quad"
  mixed: False
  state_dim: 64

model:
  is_unconditional: 0
  timeemb: 32
  featureemb: 32
  target_strategy: "random"
  mixed: False
