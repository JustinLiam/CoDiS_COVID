
dataset:
  data_name: "covid"

train:
  epochs: 500
  batch_size: 256
  lr: 0.0005
  weight_decay: 0.002
  valid_epoch_interval: 50

diffusion:
  conditioning: "fused_add"
  fused_cond_dim: 155
  layers: 6
  channels: 64
  input_vars: 11
  cond_dim: 11
  seq_len: 14
  target_dim: 2
  hidden_dim: 256
  side_dim: 33
  nheads: 2
  diffusion_embedding_dim: 128
  beta_start: 0.0001
  beta_end: 0.5
  num_steps: 100
  schedule: "quad"
  mixed: False
  state_dim: 64

model:
  is_unconditional: 0
  timeemb: 32
  featureemb: 32
  target_strategy: "random"
  mixed: False
